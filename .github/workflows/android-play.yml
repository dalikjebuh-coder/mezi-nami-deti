name: Android Play

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Bez nastavených secrets (ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD)
      # se postaví NEPODEPSANÝ AAB — projde celý toolchain, ale Play ho nepřijme.
      - name: Build AAB (signed when keystore secret is set)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.p12"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.p12"
            export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            echo "Keystore secret nalezen - stavim PODEPSANY AAB."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 neni nastaveny - stavim NEPODEPSANY AAB (jen smoke test, do Play nenahravat)."
          fi
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mezi-nami-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
